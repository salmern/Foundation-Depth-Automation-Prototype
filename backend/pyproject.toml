[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "foundation-mvp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2", "pydantic==2.11.4", "python-multipart==0.0.20", "ezdxf==1.4.2", "shapely==2.1.0", "openpyxl==3.1.5"]
[project.optional-dependencies]
test = ["pytest==8.3.5", "httpx==0.28.1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
